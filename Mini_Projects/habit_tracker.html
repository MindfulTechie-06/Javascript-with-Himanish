<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-2: #0b1220;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --border: #1f2937;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent);
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box h3 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .stat-box p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    input, select, button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      outline: none;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 700;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .btn-primary {
      background: var(--accent);
      color: #00111a;
      border: none;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
      border: none;
    }

    .btn-danger {
      background: var(--red);
      color: white;
      border: none;
    }

    .btn-success {
      background: var(--green);
      color: white;
      border: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .habit-list {
      display: grid;
      gap: 12px;
    }

    .habit-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .habit-info h3 {
      margin: 0 0 8px;
      font-size: 1.03rem;
    }

    .done-text {
      text-decoration: line-through;
      opacity: 0.72;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      margin-right: 6px;
      margin-top: 6px;
      white-space: nowrap;
    }

    .high {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .medium {
      background: rgba(245, 158, 11, 0.14);
      color: #fde68a;
    }

    .low {
      background: rgba(34, 197, 94, 0.14);
      color: #bbf7d0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      min-width: 210px;
    }

    .actions button {
      width: auto;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .small-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    @media (max-width: 980px) {
      .grid,
      .stats,
      .controls {
        grid-template-columns: 1fr;
      }

      .habit-item {
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Habit Tracker</h1>
      <p>Track habits, build streaks, search, filter, and export reports.</p>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h3 id="totalHabits">0</h3>
        <p>Total Habits</p>
      </div>
      <div class="stat-box">
        <h3 id="completedHabits">0</h3>
        <p>Completed</p>
      </div>
      <div class="stat-box">
        <h3 id="pendingHabits">0</h3>
        <p>Pending</p>
      </div>
      <div class="stat-box">
        <h3 id="bestStreak">0</h3>
        <p>Highest Streak</p>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Add Habit</h2>

        <div class="form-group">
          <label for="habitName">Habit Name</label>
          <input type="text" id="habitName" placeholder="e.g. Read 10 pages" />
        </div>

        <div class="form-group">
          <label for="habitPriority">Priority</label>
          <select id="habitPriority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div class="row">
          <button class="btn-primary" onclick="addHabit()">Add Habit</button>
          <button class="btn-secondary" onclick="exportReport()">Export Report</button>
        </div>

        <div class="controls" style="margin-top: 12px;">
          <div class="form-group" style="margin: 0;">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Search habits..." />
          </div>

          <div class="form-group" style="margin: 0;">
            <label for="filterSelect">Filter</label>
            <select id="filterSelect">
              <option value="all">All</option>
              <option value="done">Completed</option>
              <option value="pending">Pending</option>
            </select>
          </div>
        </div>

        <div class="small-note">
          Tip: high priority habits show first.
        </div>
      </div>

      <div class="card">
        <h2>Your Habits</h2>
        <div id="habitList" class="habit-list"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "habitTrackerData_v1";

    let habits = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    function saveHabits() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    function normalizePriority(priority) {
      const p = String(priority || "").toLowerCase().trim();
      if (["high", "medium", "low"].includes(p)) return p;
      return "medium";
    }

    function resetDailyStatus() {
      const today = new Date().toDateString();
      let changed = false;

      habits.forEach(habit => {
        if (habit.lastUpdated !== today) {
          habit.done = false;
          habit.lastUpdated = today;
          changed = true;
        }
      });

      if (changed) saveHabits();
    }

    function sortByPriority(list) {
      const order = { high: 1, medium: 2, low: 3 };
      return [...list].sort((a, b) => order[a.priority] - order[b.priority]);
    }

    function getFilteredHabits() {
      const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
      const filterValue = document.getElementById("filterSelect").value;

      return habits.filter(habit => {
        const matchesSearch = habit.name.toLowerCase().includes(searchText);
        const matchesFilter =
          filterValue === "all" ||
          (filterValue === "done" && habit.done) ||
          (filterValue === "pending" && !habit.done);

        return matchesSearch && matchesFilter;
      });
    }

    function updateStats() {
      document.getElementById("totalHabits").textContent = habits.length;
      document.getElementById("completedHabits").textContent = habits.filter(h => h.done).length;
      document.getElementById("pendingHabits").textContent = habits.filter(h => !h.done).length;
      document.getElementById("bestStreak").textContent =
        habits.length ? Math.max(...habits.map(h => h.streak || 0)) : 0;
    }

    function renderHabits() {
      updateStats();

      const habitList = document.getElementById("habitList");
      const filtered = sortByPriority(getFilteredHabits());

      if (filtered.length === 0) {
        habitList.innerHTML = `<div class="empty">No habits found.</div>`;
        return;
      }

      habitList.innerHTML = filtered.map(habit => `
        <div class="habit-item">
          <div class="habit-info">
            <h3 class="${habit.done ? "done-text" : ""}">${escapeHtml(habit.name)}</h3>
            <div class="meta">
              <span class="tag ${habit.priority}">${habit.priority.toUpperCase()}</span>
              <span class="tag" style="background: rgba(56, 189, 248, 0.12); color: #7dd3fc;">
                Streak: ${habit.streak || 0}
              </span>
              <br />
              Status: ${habit.done ? "Completed" : "Pending"} <br />
              Created: ${habit.createdAt}
            </div>
          </div>

          <div class="actions">
            <button class="btn-success" onclick="markDone(${habit.id})">Done</button>
            <button class="btn-secondary" onclick="editHabit(${habit.id})">Edit</button>
            <button class="btn-danger" onclick="deleteHabit(${habit.id})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function addHabit() {
      const nameInput = document.getElementById("habitName");
      const priorityInput = document.getElementById("habitPriority");

      const name = nameInput.value.trim();
      const priority = normalizePriority(priorityInput.value);

      if (!name) {
        alert("Please enter a habit name.");
        return;
      }

      habits.push({
        id: Date.now(),
        name,
        priority,
        done: false,
        streak: 0,
        lastCompleted: null,
        lastUpdated: new Date().toDateString(),
        createdAt: new Date().toLocaleString()
      });

      saveHabits();
      nameInput.value = "";
      priorityInput.value = "medium";
      renderHabits();
    }

    function markDone(id) {
      const today = new Date().toDateString();
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toDateString();

      habits = habits.map(habit => {
        if (habit.id !== id) return habit;

        if (habit.lastCompleted === today) {
          alert("Already marked done today.");
          return habit;
        }

        let streak = 1;
        if (habit.lastCompleted === yesterdayStr) {
          streak = (habit.streak || 0) + 1;
        }

        return {
          ...habit,
          done: true,
          streak,
          lastCompleted: today,
          lastUpdated: today
        };
      });

      saveHabits();
      renderHabits();
    }

    function deleteHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const ok = confirm(`Delete habit: ${habit.name}?`);
      if (!ok) return;

      habits = habits.filter(h => h.id !== id);
      saveHabits();
      renderHabits();
    }

    function editHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const newName = prompt("Enter new habit name:", habit.name);
      if (newName === null) return;

      const newPriority = prompt("Enter new priority (high/medium/low):", habit.priority);
      if (newPriority === null) return;

      const cleanName = newName.trim();
      const cleanPriority = normalizePriority(newPriority);

      if (!cleanName) {
        alert("Habit name cannot be empty.");
        return;
      }

      habit.name = cleanName;
      habit.priority = cleanPriority;
      saveHabits();
      renderHabits();
    }

    function exportReport() {
      const total = habits.length;
      const completed = habits.filter(h => h.done).length;
      const pending = habits.filter(h => !h.done).length;
      const highestStreak = habits.length ? Math.max(...habits.map(h => h.streak || 0)) : 0;
      const completionRate = total === 0 ? "0.00" : ((completed / total) * 100).toFixed(2);

      const report = [
        "===== HABIT TRACKER REPORT =====",
        "",
        `Date: ${new Date().toDateString()}`,
        `Total Habits: ${total}`,
        `Completed: ${completed}`,
        `Pending: ${pending}`,
        `Completion Rate: ${completionRate}%`,
        `Highest Streak: ${highestStreak}`,
        "",
        "Habit Details:",
        ...habits.map(h => `- ${h.name} | ${h.priority} | ${h.done ? "Done" : "Pending"} | Streak: ${h.streak || 0}`)
      ].join("\n");

      const blob = new Blob([report], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "habit-report.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("searchInput").addEventListener("input", renderHabits);
    document.getElementById("filterSelect").addEventListener("change", renderHabits);

    resetDailyStatus();
    renderHabits();
  </script>
</body>
</html>
